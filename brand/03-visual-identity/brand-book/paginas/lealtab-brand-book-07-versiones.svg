ant-numeric:tabular-nums;" letter-spacing="2.2" >LEALTAB · BRAND BOOK · 07 · LOGO</text><text x="96" y="166" font-family="Archivo" font-weight="800" font-size="76" fill="#0F2A22" text-anchor="start" style="font-stretch:75%;text-transform:uppercase;" >Versiones</text><text font-family="Manrope" font-size="19" fill="#4D635A" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="1240" y="112" font-weight="500">Cuatro versiones, todas con los trazos congelados. Cada una</tspan><tspan x="1240" y="139.55" font-weight="500">existe en noche, lino, lino con fondo noche, negro y blanco.</tspan></text><rect x="102" y="242" width="850" height="366" rx="14" fill="#0F2A22"/><rect x="96" y="236" width="850" height="366" rx="14" fill="#FFFDF8" stroke="#0F2A22" stroke-width="2.5"/><rect x="116" y="256" width="500" height="326" rx="10" fill="#F3EFE6"/><g fill="#0F2A22" transform="translate(146 367.958) scale(0.543)" ><use href="#isotipo"/><use href="#wordmark"/></g><text x="644" y="300" font-family="Archivo" font-weight="800" font-size="36" fill="#0F2A22" text-anchor="start" style="font-stretch:75%;text-transform:uppercase;" >Horizontal</text><text font-family="Manrope" font-size="20" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="644" y="344" font-weight="600">Versión principal.</tspan></text><text font-family="Manrope" font-size="16" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="644" y="386" font-weight="500">Símbolo = 1.5 C · espacio 0.48 C</tspan></text><text font-family="Manrope" font-size="16" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="644" y="414.4" font-weight="500">Mínimo: 80 px / 25 mm</tspan></text><text font-family="Manrope" font-size="16" fill="#4D635A" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="644" y="442.8" font-weight="500">svg/lealtab-horizontal-*.svg</tspan></text><rect x="980" y="242" width="850" height="366" rx="14" fill="#0F2A22"/><rect x="974" y="236" width="850" height="366" rx="14" fill="#FFFDF8" stroke="#0F2A22" stroke-width="2.5"/><rect x="994" y="256" width="500" height="326" rx="10" fill="#F3EFE6"/><g fill="#0F2A22" transform="translate(1088.445 291) scale(0.785)" ><use href="#isotipo" transform="translate(89.5563 0)"/><use href="#wordmark" transform="translate(-211.62 206.8) scale(0.75)"/></g><text x="1522" y="300" font-family="Archivo" font-weight="800" font-size="36" fill="#0F2A22" text-anchor="start" style="font-stretch:75%;text-transform:uppercase;" >Vertical</text><text font-family="Manrope" font-size="20" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="1522" y="344" font-weight="600">Para espacios más altos que</tspan><tspan x="1522" y="372" font-weight="600">anchos.</tspan></text><text font-family="Manrope" font-size="16" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="1522" y="414" font-weight="500">Símbolo = 2 C, arriba y centrado</tspan></text><text font-family="Manrope" font-size="16" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="1522" y="442.4" font-weight="500">Separación 0.45 C · mínimo 56 px / 16</tspan><tspan x="1522" y="464.8" font-weight="500">mm</tspan></text><text font-family="Manrope" font-size="16" fill="#4D635A" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="1522" y="493.2" font-weight="500">svg/lealtab-vertical-*.svg</tspan></text><rect x="102" y="636" width="850" height="366" rx="14" fill="#0F2A22"/><rect x="96" y="630" width="850" height="366" rx="14" fill="#FFFDF8" stroke="#0F2A22" stroke-width="2.5"/><rect x="116" y="650" width="500" height="326" rx="10" fill="#F3EFE6"/><g fill="#0F2A22" transform="translate(277.436 738) scale(0.798)" ><use href="#isotipo"/></g><text x="644" y="694" font-family="Archivo" font-weight="800" font-size="36" fill="#0F2A22" text-anchor="start" style="font-stretch:75%;text-transform:uppercase;" >Isotipo</text><text font-family="Manrope" font-size="20" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="644" y="738" font-weight="600">El símbolo solo: íconos,</tspan><tspan x="644" y="766" font-weight="600">avatares y favicon.</tspan></text><text font-family="Manrope" font-size="16" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="644" y="808" font-weight="500">222 × 188 u · mínimo 16 px (pixel-fit) /</tspan><tspan x="644" y="830.4" font-weight="500">6 mm</tspan></text><text font-family="Manrope" font-size="16" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="644" y="858.8" font-weight="500">Bajo 48 px se usa el ajuste a píxel</tspan></text><text font-family="Manrope" font-size="16" fill="#4D635A" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="644" y="887.2" font-weight="500">svg/lealtab-isotipo-*.svg</tspan></text><rect x="980" y="636" width="850" height="366" rx="14" fill="#0F2A22"/><rect x="974" y="630" width="850" height="366" rx="14" fill="#FFFDF8" stroke="#0F2A22" stroke-width="2.5"/><rect x="994" y="650" width="500" height="326" rx="10" fill="#F3EFE6"/><g fill="#0F2A22" transform="translate(1054 764.697) scale(0.719)" ><use href="#wordmark" transform="translate(-282.16 -24.58)"/></g><text x="1522" y="694" font-family="Archivo" font-weight="800" font-size="36" fill="#0F2A22" text-anchor="start" style="font-stretch:75%;text-transform:uppercase;" >Wordmark</text><text font-family="Manrope" font-size="20" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="1522" y="738" font-weight="600">El nombre solo, cuando el</tspan><tspan x="1522" y="766" font-weight="600">símbolo ya está cerca.</tspan></text><text font-family="Manrope" font-size="16" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="1522" y="808" font-weight="500">Archivo 75/800 a curvas; no se</tspan><tspan x="1522" y="830.4" font-weight="500">escribe con texto</tspan></text><text font-family="Manrope" font-size="16" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="1522" y="858.8" font-weight="500">Mínimo: 56 px / 15 mm</tspan></text><text font-family="Manrope" font-size="16" fill="#4D635A" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="1522" y="887.2" font-weight="500">svg/lealtab-wordmark-*.svg</tspan></text><line x1="96" y1="1026" x2="1824" y2="1026" stroke="#D8CFBF" stroke-width="1.5"/><text x="96" y="1056" font-family="Manrope" font-weight="600" font-size="14" fill="#4D635A" text-anchor="start" style="font-variant-numeric:tabular-nums;" >LealTab · Brand book · Aprobado 2026-10-06</text><text x="1824" y="1056" font-family="Manrope" font-weight="800" font-size="14" fill="#0F2A22" text-anchor="end" style="font-variant-numeric:tabular-nums;" >07 / 24</text></svg>
