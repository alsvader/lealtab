r-nums;" >foto oscura simulada</text><rect x="1503.6" y="242" width="326.4" height="470" rx="14" fill="#0F2A22"/><rect x="1497.6" y="236" width="326.4" height="470" rx="14" fill="#FFFDF8" stroke="#0F2A22" stroke-width="2.5"/><rect x="1515.6" y="254" width="290.4" height="230" rx="10" fill="#F3EFE6"/><g fill="#FF9F6E" transform="translate(1542.6 341.576) scale(0.292)" ><use href="#isotipo"/><use href="#wordmark"/></g><path d="M1537.6 276L1784 462" stroke="#C2560F" stroke-width="5" stroke-linecap="round"/><circle cx="1531.6" cy="522" r="14" fill="#C2560F"/><path d="M1526.84 517.24L1536.36 526.76M1536.36 517.24L1526.84 526.76" fill="none" stroke="#FFFDF8" stroke-width="3.08" stroke-linecap="round" stroke-linejoin="round"/><text x="1555.6" y="530" font-family="Archivo" font-weight="800" font-size="26" fill="#0F2A22" text-anchor="start" style="font-stretch:75%;text-transform:uppercase;" >Durazno</text><text x="1804" y="530" font-family="Manrope" font-weight="800" font-size="16" fill="#4D635A" text-anchor="end" style="font-variant-numeric:tabular-nums;" >#FF9F6E</text><text font-family="Manrope" font-size="19" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="1517.6" y="572" font-weight="600">Nunca es color del logo ni fondo</tspan><tspan x="1517.6" y="598.6" font-weight="600">de marca.</tspan></text><text x="1517.6" y="680" font-family="Manrope" font-weight="700" font-size="16" fill="#4D635A" text-anchor="start" style="font-variant-numeric:tabular-nums;" >contraste 1.75:1</text><rect x="102" y="742" width="1728" height="260" rx="14" fill="#0F2A22"/><rect x="96" y="736" width="1728" height="260" rx="14" fill="#FFFDF8" stroke="#0F2A22" stroke-width="2.5"/><text x="124" y="790" font-family="Archivo" font-weight="800" font-size="30" fill="#0F2A22" text-anchor="start" style="font-stretch:75%;text-transform:uppercase;" >Reglas de color</text><text font-family="Manrope" font-size="19" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="124" y="840" font-weight="500">Solo cuatro colores para el logo:</tspan><tspan font-weight="700"> noche, lino, negro y blanco</tspan><tspan font-weight="500">. Si dudas, usa noche sobre lino.</tspan></text><text font-family="Manrope" font-size="19" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="980" y="840" font-weight="500">Fondos que sí: lino, blanco lino, noche, bosque (con logo lino) y foto con una zona limpia.</tspan></text><text font-family="Manrope" font-size="19" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="124" y="912" font-weight="700">Noche sobre durazno no se usa</tspan><tspan font-weight="500">, aunque pase el contraste: el durazno se reserva para el</tspan><tspan x="124" y="938.6" font-weight="500">momento en que se completa una recompensa.</tspan></text><text font-family="Manrope" font-size="19" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="980" y="912" font-weight="500">Negro y blanco puros son solo para impresión a una tinta y fotos; en pantalla, noche y lino.</tspan></text><line x1="96" y1="1026" x2="1824" y2="1026" stroke="#D8CFBF" stroke-width="1.5"/><text x="96" y="1056" font-family="Manrope" font-weight="600" font-size="14" fill="#4D635A" text-anchor="start" style="font-variant-numeric:tabular-nums;" >LealTab · Brand book · Aprobado 2026-10-06</text><text x="1824" y="1056" font-family="Manrope" font-weight="800" font-size="14" fill="#0F2A22" text-anchor="end" style="font-variant-numeric:tabular-nums;" >08 / 24</text></svg>
