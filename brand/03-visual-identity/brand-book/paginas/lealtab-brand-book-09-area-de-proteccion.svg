font-variant-numeric:tabular-nums;" letter-spacing="2.2" >LEALTAB · BRAND BOOK · 09 · LOGO</text><text x="96" y="166" font-family="Archivo" font-weight="800" font-size="76" fill="#0F2A22" text-anchor="start" style="font-stretch:75%;text-transform:uppercase;" >Área de protección</text><text font-family="Manrope" font-size="19" fill="#4D635A" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="1240" y="112" font-weight="500">El aire alrededor del logo es parte del logo.</tspan></text><rect x="102" y="242" width="1120" height="760" rx="14" fill="#0F2A22"/><rect x="96" y="236" width="1120" height="760" rx="14" fill="#FFFDF8" stroke="#0F2A22" stroke-width="2.5"/><rect x="120" y="260" width="1072" height="712" rx="10" fill="#F3EFE6"/><rect x="160" y="497.6" width="610.986" height="237.6" fill="none" stroke="#0F2A22" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="175.6" y="513.2" width="579.786" height="206.4" fill="#FFD9C4"/><rect x="222.4" y="560" width="486.186" height="112.8" fill="#F3EFE6"/><g fill="#0F2A22" transform="translate(222.4 560) scale(0.6)" ><use href="#isotipo"/><use href="#wordmark"/></g><path d="M222.4 499.2H253.6M222.4 492.2V506.2M253.6 492.2V506.2" stroke="#C2560F" stroke-width="2" fill="none"/><text x="238" y="487.2" font-family="Manrope" font-weight="800" font-size="17" fill="#C2560F" text-anchor="middle" style="font-variant-numeric:tabular-nums;" >x</text><path d="M175.6 616.4H222.4M175.6 609.4V623.4M222.4 609.4V623.4" stroke="#C2560F" stroke-width="2" fill="none"/><text x="199" y="604.4" font-family="Manrope" font-weight="800" font-size="15" fill="#C2560F" text-anchor="middle" style="font-variant-numeric:tabular-nums;" >1.5x</text><text x="766.986" y="487.6" font-family="Manrope" font-weight="800" font-size="16" fill="#C2560F" text-anchor="end" style="font-variant-numeric:tabular-nums;" >2x</text><rect x="813.697" y="466.76" width="338.303" height="299.009" fill="none" stroke="#0F2A22" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="828.257" y="481.32" width="309.183" height="269.889" fill="#FFD9C4"/><rect x="871.937" y="525" width="221.823" height="182.529" fill="#F3EFE6"/><g fill="#0F2A22" transform="translate(871.937 525) scale(0.56)" ><use href="#isotipo" transform="translate(89.5563 0)"/><use href="#wordmark" transform="translate(-211.62 206.8) scale(0.75)"/></g><text x="160" y="775.2" font-family="Manrope" font-weight="800" font-size="17" fill="#0F2A22" text-anchor="start" style="font-variant-numeric:tabular-nums;" >horizontal</text><text x="813.697" y="805.769" font-family="Manrope" font-weight="800" font-size="17" fill="#0F2A22" text-anchor="start" style="font-variant-numeric:tabular-nums;" >vertical</text><text x="144" y="940" font-family="Manrope" font-weight="600" font-size="17" fill="#4D635A" text-anchor="start" style="font-variant-numeric:tabular-nums;" >Durazno claro: zona libre de 1.5x · línea punteada: 2x recomendado</text><rect x="1250" y="242" width="580" height="760" rx="14" fill="#0F2A22"/><rect x="1244" y="236" width="580" height="760" rx="14" fill="#FFFDF8" stroke="#0F2A22" stroke-width="2.5"/><text x="1272" y="292" font-family="Archivo" font-weight="800" font-size="30" fill="#0F2A22" text-anchor="start" style="font-stretch:75%;text-transform:uppercase;" >La unidad x</text><text font-family="Manrope" font-size="21" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="1272" y="340" font-weight="700">x = el grosor del trazo del isotipo (52 u).</tspan><tspan font-weight="500"> Se mide</tspan><tspan x="1272" y="370.45" font-weight="500">sobre el propio logo, así que crece y se achica con él.</tspan></text><text x="1272" y="444.9" font-family="Archivo" font-weight="800" font-size="30" fill="#0F2A22" text-anchor="start" style="font-stretch:75%;text-transform:uppercase;" >Cuánto espacio</text><circle cx="1278" cy="485.9" r="4" fill="#0F2A22"/><text font-family="Manrope" font-size="20" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="1294" y="492.9" font-weight="700">Mínimo: 1.5x por lado</tspan><tspan font-weight="500"> en las cuatro versiones.</tspan></text><circle cx="1278" cy="526.9" r="4" fill="#0F2A22"/><text font-family="Manrope" font-size="20" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="1294" y="533.9" font-weight="700">Si hay espacio: 2x por lado.</tspan></text><circle cx="1278" cy="567.9" r="4" fill="#0F2A22"/><text font-family="Manrope" font-size="20" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="1294" y="574.9" font-weight="500">En esa zona no entra nada: ni texto, ni bordes, ni</tspan><tspan x="1294" y="603.9" font-weight="500">otras imágenes. Tampoco puede quedar pegada al</tspan><tspan x="1294" y="632.9" font-weight="500">borde de la página.</tspan></text><circle cx="1278" cy="666.9" r="4" fill="#0F2A22"/><text font-family="Manrope" font-size="20" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="1294" y="673.9" font-weight="500">Se mide desde la tinta del logo, no desde un recuadro</tspan><tspan x="1294" y="702.9" font-weight="500">imaginario.</tspan></text><circle cx="1278" cy="736.9" r="4" fill="#0F2A22"/><text font-family="Manrope" font-size="20" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="1294" y="743.9" font-weight="500">Los archivos “con-area” ya traen el 1.5x en el lienzo.</tspan></text><line x1="96" y1="1026" x2="1824" y2="1026" stroke="#D8CFBF" stroke-width="1.5"/><text x="96" y="1056" font-family="Manrope" font-weight="600" font-size="14" fill="#4D635A" text-anchor="start" style="font-variant-numeric:tabular-nums;" >LealTab · Brand book · Aprobado 2026-10-06</text><text x="1824" y="1056" font-family="Manrope" font-weight="800" font-size="14" fill="#0F2A22" text-anchor="end" style="font-variant-numeric:tabular-nums;" >09 / 24</text></svg>
