61 106.86Q663.63 102.67 672.75 100.66Q681.88 98.65 693.92 98.65V89.53Q693.92 86.06 692.91 83.69Q691.91 81.32 689.81 80.04Q687.71 78.77 684.25 78.77Q680.78 78.77 678.5 80.04Q676.22 81.32 675.22 83.51Q674.21 85.7 674.21 88.44V90.08H649.04Q648.86 89.35 648.86 88.62Q648.86 87.89 648.86 87.16Q648.86 77.67 653.23 71.29Q657.61 64.9 665.73 61.62Q673.85 58.33 685.16 58.33Q695.01 58.33 702.95 61.07Q710.88 63.81 715.54 70.37Q720.19 76.94 720.19 88.44V131.86Q720.19 134.77 721.56 136.42Q722.92 138.06 725.66 138.06H730.04V155.57Q727.12 156.85 723.11 157.85Q719.09 158.86 714.35 158.86Q709.24 158.86 705.5 157.31Q701.76 155.75 699.48 153.11Q697.2 150.46 696.47 146.82H695.56Q693.19 150.1 689.81 152.84Q686.44 155.57 681.88 157.21Q677.32 158.86 670.93 158.86ZM681.51 138.42Q684.25 138.42 686.53 137.24Q688.81 136.05 690.45 133.86Q692.09 131.67 693.01 128.75Q693.92 125.84 693.92 122.19V113.61Q685.89 113.61 681.24 115.44Q676.59 117.26 674.58 120.45Q672.57 123.65 672.57 128.02Q672.57 131.31 673.67 133.68Q674.76 136.05 676.68 137.24Q678.59 138.42 681.51 138.42Z"/><path id="wm-b" d="M781.12 158.86Q772.55 158.86 766.98 154.93Q761.42 151.01 758.32 144.81H757.22L755.58 156.67H733.87V24.58H760.32V70.92H761.24Q763.24 67.09 766.07 64.26Q768.9 61.44 772.91 59.88Q776.93 58.33 782.03 58.33Q791.52 58.33 797.81 63.53Q804.11 68.73 807.21 79.68Q810.31 90.62 810.31 107.77Q810.31 125.11 807.12 136.51Q803.93 147.91 797.45 153.38Q790.97 158.86 781.12 158.86ZM771.64 136.42Q776.01 136.42 778.48 134.14Q780.94 131.86 782.03 127.11Q783.13 122.37 783.13 115.07V103.21Q783.13 95.73 782.03 91.08Q780.94 86.43 778.39 84.15Q775.83 81.87 771.82 81.87Q768.53 81.87 766.34 83.24Q764.16 84.6 762.79 87.25Q761.42 89.9 760.78 94Q760.14 98.1 760.14 103.58V114.71Q760.14 121.64 761.24 126.47Q762.33 131.31 764.88 133.86Q767.44 136.42 771.64 136.42Z"/></g></defs><rect width="1920" height="1080" fill="#F3EFE6"/><text x="96" y="82" font-family="Manrope" font-weight="800" font-size="15" fill="#0F2A22" text-anchor="start" style="font-variant-numeric:tabular-nums;" letter-spacing="2.2" >LEALTAB · BRAND BOOK · 05 · MARCA</text><text x="96" y="166" font-family="Archivo" font-weight="800" font-size="76" fill="#0F2A22" text-anchor="start" style="font-stretch:75%;text-transform:uppercase;" >Voz y tono</text><text font-family="Manrope" font-size="19" fill="#4D635A" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="1240" y="112" font-weight="500">Claro, concreto y cercano. La voz va de tú y no usa jerga.</tspan></text><rect x="102" y="242" width="600" height="470" rx="14" fill="#0F2A22"/><rect x="96" y="236" width="600" height="470" rx="14" fill="#FFFDF8" stroke="#0F2A22" stroke-width="2.5"/><text x="124" y="286" font-family="Archivo" font-weight="800" font-size="28" fill="#0F2A22" text-anchor="start" style="font-stretch:75%;text-transform:uppercase;" >Principios de voz</text><text font-family="Manrope" font-size="20" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="124" y="334" font-weight="700">Claro antes que ingenioso.</tspan><tspan font-weight="500"> Si una frase necesita</tspan><tspan x="124" y="362.4" font-weight="500">explicación, se reescribe.</tspan></text><text font-family="Manrope" font-size="20" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="124" y="404.8" font-weight="700">Concreto, no adjetivos.</tspan><tspan font-weight="500"> Mostramos qué pasa (“ves quién</tspan><tspan x="124" y="433.2" font-weight="500">no ha vuelto en un mes”), no decimos “potente” ni</tspan><tspan x="124" y="461.6" font-weight="500">“innovador”.</tspan></text><text font-family="Manrope" font-size="20" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="124" y="504" font-weight="700">Cercano y respetuoso.</tspan><tspan font-weight="500"> Como alguien que sabe de</tspan><tspan x="124" y="532.4" font-weight="500">tecnología y entiende un negocio de mostrador; nunca</tspan><tspan x="124" y="560.8" font-weight="500">condescendiente.</tspan></text><text font-family="Manrope" font-size="20" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="124" y="603.2" font-weight="700">Seguro, sin exagerar.</tspan><tspan font-weight="500"> Sin urgencia falsa, sin promesas</tspan><tspan x="124" y="631.6" font-weight="500">que el producto no cumple, sin mayúsculas ni signos de</tspan><tspan x="124" y="660" font-weight="500">más.</tspan></text><rect x="102" y="736" width="600" height="266" rx="14" fill="#0F2A22"/><rect x="96" y="730" width="600" height="266" rx="14" fill="#FFFDF8" stroke="#0F2A22" stroke-width="2.5"/><text x="124" y="780" font-family="Archivo" font-weight="800" font-size="28" fill="#0F2A22" text-anchor="start" style="font-stretch:75%;text-transform:uppercase;" >Tú o usted</text><text font-family="Manrope" font-size="20" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="124" y="826" font-weight="700">Hablamos de tú.</tspan><tspan font-weight="500"> Si en soporte el cliente escribe de usted,</tspan><tspan x="124" y="855" font-weight="500">contestamos de usted. Los documentos legales pueden ir</tspan><tspan x="124" y="884" font-weight="500">en un registro más formal. En la tarjeta del cliente final el</tspan><tspan x="124" y="913" font-weight="500">negocio elige; por defecto, tú.</tspan></text><rect x="730" y="242" width="1100" height="760" rx="14" fill="#0F2A22"/><rect x="724" y="236" width="1100" height="760" rx="14" fill="#FFFDF8" stroke="#0F2A22" stroke-width="2.5"/><text x="752" y="286" font-family="Archivo" font-weight="800" font-size="28" fill="#0F2A22" text-anchor="start" style="font-stretch:75%;text-transform:uppercase;" >Tono por contexto</text><text x="754" y="322" font-family="Manrope" font-weight="800" font-size="12" fill="#4D635A" text-anchor="start" style="font-variant-numeric:tabular-nums;" letter-spacing="1.2" >CONTEXTO</text><text x="984" y="322" font-family="Manrope" font-weight="800" font-size="12" fill="#4D635A" text-anchor="start" style="font-variant-numeric:tabular-nums;" letter-spacing="1.2" >TONO</text><text x="1314" y="322" font-family="Manrope" font-weight="800" font-size="12" fill="#4D635A" text-anchor="start" style="font-variant-numeric:tabular-nums;" letter-spacing="1.2" >EJEMPLO</text><line x1="744" y1="334" x2="1804" y2="334" stroke="#0F2A22" stroke-width="1.5"/><rect x="744" y="334" width="1060" height="40" fill="#F3EFE6"/><text font-family="Manrope" font-size="16" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="754" y="359.2" font-weight="700">Landing</tspan></text><text font-family="Manrope" font-size="16" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="984" y="359.2" font-weight="500">Seguro y directo; beneficio primero.</tspan></text><text font-family="Manrope" font-size="16" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="1314" y="359.2" font-weight="500">“Tu tarjeta de lealtad, ahora en el celular de tus clientes.”</tspan></text><line x1="744" y1="374" x2="1804" y2="374" stroke="#D8CFBF" stroke-width="1"/><text font-family="Manrope" font-size="16" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="754" y="399.2" font-weight="700">Onboarding</tspan></text><text font-family="Manrope" font-size="16" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="984" y="399.2" font-weight="500">Guía breve, un paso a la vez, celebra</tspan><tspan x="984" y="421.28" font-weight="500">poco.</tspan></text><text font-family="Manrope" font-size="16" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="1314" y="399.2" font-weight="500">“Sube tu logo. Así te van a reconocer tus clientes.”</tspan></text><line x1="744" y1="436.08" x2="1804" y2="436.08" stroke="#D8CFBF" stroke-width="1"/><rect x="744" y="436.08" width="1060" height="40" fill="#F3EFE6"/><text font-family="Manrope" font-size="16" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="754" y="461.28" font-weight="700">Soporte por WhatsApp</tspan></text><text font-family="Manrope" font-size="16" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="984" y="461.28" font-weight="500">Humano, rápido, con nombre propio.</tspan></text><text font-family="Manrope" font-size="16" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="1314" y="461.28" font-weight="500">“Hola, soy Aarón de LealTab. Ya lo revisé: tu tarjeta quedó lista.”</tspan></text><line x1="744" y1="476.08" x2="1804" y2="476.08" stroke="#D8CFBF" stroke-width="1"/><text font-family="Manrope" font-size="16" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="754" y="501.28" font-weight="700">Mensajes de error</tspan></text><text font-family="Manrope" font-size="16" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="984" y="501.28" font-weight="500">Calmado; dice qué pasó y qué hacer.</tspan><tspan x="984" y="523.36" font-weight="500">Nunca culpa.</tspan></text><text font-family="Manrope" font-size="16" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="1314" y="501.28" font-weight="500">“No pudimos guardar los cambios. Revisa tu conexión e</tspan><tspan x="1314" y="523.36" font-weight="500">inténtalo otra vez.”</tspan></text><line x1="744" y1="538.16" x2="1804" y2="538.16" stroke="#D8CFBF" stroke-width="1"/><rect x="744" y="538.16" width="1060" height="62.08" fill="#F3EFE6"/><text font-family="Manrope" font-size="16" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="754" y="563.36" font-weight="700">Redes sociales</tspan></text><text font-family="Manrope" font-size="16" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="984" y="563.36" font-weight="500">Más ligero y visual; humor suave; casos</tspan><tspan x="984" y="585.44" font-weight="500">reales.</tspan></text><text font-family="Manrope" font-size="16" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="1314" y="563.36" font-weight="500">“El cartón se pierde en la cartera. La tarjeta digital, no.”</tspan></text><line x1="744" y1="600.24" x2="1804" y2="600.24" stroke="#D8CFBF" stroke-width="1"/><text font-family="Manrope" font-size="16" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="754" y="625.44" font-weight="700">Tarjeta del cliente final</tspan></text><text font-family="Manrope" font-size="16" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="984" y="625.44" font-weight="500">Con la voz del negocio, no de LealTab.</tspan><tspan x="984" y="647.52" font-weight="500">Breve y cálido.</tspan></text><text font-family="Manrope" font-size="16" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="1314" y="625.44" font-weight="500">“¡Llevas 4 de 5! El siguiente corte va por nuestra cuenta.”</tspan></text><line x1="744" y1="662.32" x2="1804" y2="662.32" stroke="#D8CFBF" stroke-width="1"/><text x="752" y="696.32" font-family="Archivo" font-weight="800" font-size="22" fill="#0F2A22" text-anchor="start" style="font-stretch:75%;text-transform:uppercase;" >Decimos / no decimos</text><text x="751" y="726.32" font-family="Manrope" font-weight="800" font-size="12" fill="#4D635A" text-anchor="start" style="font-variant-numeric:tabular-nums;" letter-spacing="1.2" >DECIMOS</text><text x="1281" y="726.32" font-family="Manrope" font-weight="800" font-size="12" fill="#4D635A" text-anchor="start" style="font-variant-numeric:tabular-nums;" letter-spacing="1.2" >NO DECIMOS</text><line x1="744" y1="738.32" x2="1804" y2="738.32" stroke="#0F2A22" stroke-width="1.5"/><rect x="744" y="738.32" width="1060" height="33" fill="#F3EFE6"/><text font-family="Manrope" font-size="15" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="751" y="759.57" font-weight="500">Tus clientes regresan</tspan></text><text font-family="Manrope" font-size="15" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="1281" y="759.57" font-weight="500">Maximiza el engagement de tu base de usuarios</tspan></text><line x1="744" y1="771.32" x2="1804" y2="771.32" stroke="#D8CFBF" stroke-width="1"/><text font-family="Manrope" font-size="15" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="751" y="792.57" font-weight="500">Tarjeta digital</tspan></text><text font-family="Manrope" font-size="15" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="1281" y="792.57" font-weight="500">Solución omnicanal de fidelización</tspan></text><line x1="744" y1="804.32" x2="1804" y2="804.32" stroke="#D8CFBF" stroke-width="1"/><rect x="744" y="804.32" width="1060" height="33" fill="#F3EFE6"/><text font-family="Manrope" font-size="15" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="751" y="825.57" font-weight="500">Ves quién regresa y quién no</tspan></text><text font-family="Manrope" font-size="15" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="1281" y="825.57" font-weight="500">Analítica avanzada impulsada por IA</tspan></text><line x1="744" y1="837.32" x2="1804" y2="837.32" stroke="#D8CFBF" stroke-width="1"/><text font-family="Manrope" font-size="15" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="751" y="858.57" font-weight="500">Precio claro, sin contratos</tspan></text><text font-family="Manrope" font-size="15" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="1281" y="858.57" font-weight="500">¡Oferta por tiempo limitado! ¡Solo hoy!</tspan></text><line x1="744" y1="870.32" x2="1804" y2="870.32" stroke="#D8CFBF" stroke-width="1"/><rect x="744" y="870.32" width="1060" height="33" fill="#F3EFE6"/><text font-family="Manrope" font-size="15" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="751" y="891.57" font-weight="500">Siempre “LealTab”, con T mayúscula</tspan></text><text font-family="Manrope" font-size="15" fill="#0F2A22" style="font-variant-numeric:tabular-nums" xml:space="preserve"><tspan x="1281" y="891.57" font-weight="500">“Leal” a secas</tspan></text><line x1="744" y1="903.32" x2="1804" y2="903.32" stroke="#D8CFBF" stroke-width="1"/><line x1="96" y1="1026" x2="1824" y2="1026" stroke="#D8CFBF" stroke-width="1.5"/><text x="96" y="1056" font-family="Manrope" font-weight="600" font-size="14" fill="#4D635A" text-anchor="start" style="font-variant-numeric:tabular-nums;" >LealTab · Brand book · Aprobado 2026-10-06</text><text x="1824" y="1056" font-family="Manrope" font-weight="800" font-size="14" fill="#0F2A22" text-anchor="end" style="font-variant-numeric:tabular-nums;" >05 / 24</text></svg>
