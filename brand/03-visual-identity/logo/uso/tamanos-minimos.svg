<text x="30" y="46" font-family="Manrope" font-weight="800" font-size="12" fill="#0F2A22" text-anchor="start" style="" letter-spacing="1.4">LEALTAB · TAMAÑOS MÍNIMOS · imprimir a escala 100 % (A4 apaisado)</text><text x="30" y="84" font-family="Archivo" font-weight="800" font-size="30" fill="#0F2A22" text-anchor="start" style="font-stretch:75%;text-transform:uppercase;" >Tamaños mínimos (ancho)</text><text x="30" y="108" font-family="Manrope" font-weight="500" font-size="11.5" fill="#4D635A" text-anchor="start" style="" >Digital: 1 unidad = 1 px CSS (pantalla 1×). Impreso: medidas reales en mm al imprimir al 100 %. El isotipo bajo 48 px usa el pixel-fit aprobado.</text><rect x="30" y="130" width="250" height="620" rx="10" fill="#FFFDF8" stroke="#0F2A22" stroke-width="1.5"/><text x="44" y="156" font-family="Archivo" font-weight="800" font-size="18" fill="#0F2A22" text-anchor="start" style="font-stretch:75%;text-transform:uppercase;" >Horizontal</text><text x="44" y="174" font-family="Manrope" font-weight="600" font-size="10.5" fill="#4D635A" text-anchor="start" style="" >Propuesta de Aarón: 96 px / 25 mm</text><text x="44" y="190" font-family="Manrope" font-weight="800" font-size="10.5" fill="#C2560F" text-anchor="start" style="" >px corregido a 80 · mm validado</text><text x="44" y="222" font-family="Manrope" font-weight="800" font-size="13" fill="#0F2A22" text-anchor="start" style="" >Digital · 80 px</text><g fill="#0F2A22" transform="translate(44 236) scale(0.098728)"><use href="#isotipo"/><use href="#wordmark"/></g><text x="44" y="272.561" font-family="Manrope" font-weight="500" font-size="10.5" fill="#4D635A" text-anchor="start" style="" >80 × 19 px a tamaño real</text><text x="44" y="330" font-family="Manrope" font-weight="800" font-size="13" fill="#0F2A22" text-anchor="start" style="" >Impreso · 25 mm</text><g fill="#0F2A22" transform="translate(44 344) scale(0.116607)"><use href="#isotipo"/><use href="#wordmark"/></g><line x1="44" y1="375.922" x2="138.488" y2