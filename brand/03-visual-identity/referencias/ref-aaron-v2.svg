<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
<title>LealTab — Sistema oficial de variantes v0.6</title>
<desc>Variantes de logo aprobadas: horizontal, vertical A, isotipo, wordmark, positiva, inversa y monocromática.</desc>
<rect width="1600" height="1180" fill="#F3EFE6"/>
<style>
.h1{font:800 40px Arial,sans-serif;fill:#0F2A22}.h2{font:700 23px Arial,sans-serif;fill:#0F2A22}
.body{font:400 16px Arial,sans-serif;fill:#0F2A22}.small{font:400 14px Arial,sans-serif;fill:#0F2A22;opacity:.65}
.rule{stroke:#0F2A22;stroke-opacity:.14}.wm{font-family:"Archivo Condensed","Archivo Narrow","Arial Narrow",sans-serif;font-weight:800}
</style>

<text x="60" y="62" class="h1">LealTab · Sistema oficial de variantes</text>
<text x="60" y="95" class="body">v0.6 · Balanceada + Custom sutil + vertical A corregida</text>
<line x1="60" y1="125" x2="1540" y2="125" class="rule"/>

<!-- horizontal principal -->
<text x="60" y="172" class="h2">01 · Principal horizontal</text>
<g transform="translate(115 215)">
 <g fill="none" stroke="#0F2A22" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" transform="scale(.76)">
  <path d="M40 20 V124 Q40 156 72 156 H138"/><path d="M154 20 H178 Q210 20 210 52 V124"/>
 </g>
 <text x="190" y="110" class="wm" fill="#0F2A22" font-size="112" letter-spacing="-3.2">LealTab</text>
</g>
<text x="60" y="390" class="small">Uso preferente: web, navegación, documentos, presentaciones y piezas horizontales.</text>

<!-- vertical official -->
<text x="850" y="172" class="h2">02 · Vertical oficial</text>
<g transform="translate(1025 205)">
 <g fill="none" stroke="#0F2A22" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" transform="translate(84 0) scale(.62)">
  <path d="M40 20 V124 Q40 156 72 156 H138"/><path d="M154 20 H178 Q210 20 210 52 V124"/>
 </g>
 <text x="0" y="230" class="wm" fill="#0F2A22" font-size="108" letter-spacing="-3">LealTab</text>
</g>

<line x1="60" y1="445" x2="1540" y2="445" class="rule"/>

<!-- symbol -->
<text x="60" y="492" class="h2">03 · Isotipo</text>
<g transform="translate(140 540)" fill="none" stroke="#0F2A22" stroke-width="52" stroke-linecap="round" stroke-linejoin="round">
 <path d="M40 20 V124 Q40 156 72 156 H138"/><path d="M154 20 H178 Q210 20 210 52 V124"/>
</g>
<text x="60" y="755" class="small">Avatar, favicon, app icon y contextos donde la marca ya sea reconocible.</text>

<!-- wordmark -->
<text x="535" y="492" class="h2">04 · Wordmark</text>
<text x="535" y="645" class="wm" fill="#0F2A22" font-size="132" letter-spacing="-3.5">LealTab</text>
<text x="535" y="755" class="small">Uso secundario. No alterar el ritmo aprobado del par lT.</text>

<!-- inverse -->
<g transform="translate(1000 465)">
 <rect x="0" y="0" width="540" height="310" rx="12" fill="#0F2A22"/>
 <text x="30" y="48" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#F3EFE6">05 · Inversa</text>
 <g transform="translate(55 100)">
  <g fill="none" stroke="#F3EFE6" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" transform="scale(.55)">
   <path d="M40 20 V124 Q40 156 72 156 H138"/><path d="M154 20 H178 Q210 20 210 52 V124"/>
  </g>
  <text x="145" y="80" class="wm" fill="#F3EFE6" font-size="82" letter-spacing="-2.4">LealTab</text>
 </g>
 <text x="30" y="270" font-family="Arial,sans-serif" font-size="14" fill="#F3EFE6" opacity=".75">Lino #F3EFE6 sobre verde profundo #0F2A22</text>
</g>

<line x1="60" y1="815" x2="1540" y2="815" class="rule"/>

<!-- mono -->
<text x="60" y="862" class="h2">06 · Monocromática</text>
<g transform="translate(90 905)">
 <g fill="none" stroke="#000" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" transform="scale(.55)">
  <path d="M40 20 V124 Q40 156 72 156 H138"/><path d="M154 20 H178 Q210 20 210 52 V124"/>
 </g>
 <text x="145" y="80" class="wm" fill="#000" font-size="82" letter-spacing="-2.4">LealTab</text>
</g>
<g transform="translate(620 885)">
 <rect width="450" height="160" rx="10" fill="#000"/>
 <g transform="translate(35 43)">
  <g fill="none" stroke="#fff" stroke-width="52" stroke-linecap="round" stroke-linejoin="round" transform="scale(.43)">
   <path d="M40 20 V124 Q40 156 72 156 H138"/><path d="M154 20 H178 Q210 20 210 52 V124"/>
  </g>
  <text x="115" y="62" class="wm" fill="#fff" font-size="66" letter-spacing="-2">LealTab</text>
 </g>
</g>

<!-- color policy -->
<text x="1135" y="862" class="h2">Política de color</text>
<rect x="1135" y="900" width="78" height="78" rx="8" fill="#0F2A22"/>
<rect x="1228" y="900" width="78" height="78" rx="8" fill="#F3EFE6" stroke="#0F2A22" stroke-opacity=".12"/>
<rect x="1321" y="900" width="78" height="78" rx="8" fill="#FF9F6E"/>
<text x="1135" y="1005" class="small">#0F2A22</text><text x="1228" y="1005" class="small">#F3EFE6</text><text x="1321" y="1005" class="small">#FF9F6E</text>
<text x="1135" y="1038" class="small">El durazno es acento del sistema,</text>
<text x="1135" y="1060" class="small">no un color obligatorio del logo.</text>

<line x1="60" y1="1100" x2="1540" y2="1100" class="rule"/>
<text x="60" y="1140" class="small">Sistema v0.6 · siguiente fase: pruebas de reducción y assets digitales (favicon / app icon / avatar).</text>
</svg>