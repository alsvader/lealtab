<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="_base.css" />
</head>
<body>
  <div class="slide bg-bosque pad" style="display:flex;flex-direction:column;justify-content:space-between;">
    <img class="aro-corner aro-tr" src="../../../03-visual-identity/recursos/aro/lt-aro-marketing-completo.svg" alt="" style="filter:brightness(0) invert(1);opacity:0.14;width:560px;height:560px;" />
    <img class="aro-corner aro-bl" src="../../../03-visual-identity/recursos/aro/lt-aro-marketing-vacio.svg" alt="" style="filter:brightness(0) invert(1);opacity:0.1;" />

    <div class="topbar">
      <img class="logo-h-lg" src="../../../03-visual-identity/logo/entregables/svg/lealtab-horizontal-lino.svg" alt="LealTab" />
      <span class="handle" style="color:#CFE3D6;font-size:24px;">@getlealtab</span>
    </div>

    <div class="stack gap-40" style="position:relative;z-index:1;max-width:1200px;align-items:flex-start;">
      <h1 class="display" style="max-width:1100px;">Haz que tus clientes siempre regresen.</h1>
      <p class="lead" style="color:#CFE3D6;max-width:720px;">Crea tu tarjeta hoy. Es gratis empezar. 30 días, sin tarjeta de crédito.</p>
      <div class="row gap-20" style="align-items:center;flex-wrap:wrap;">
        <div class="btn btn-lg" style="background:#FFFDF8;color:#0F2A22;">Crea tu tarjeta gratis</div>
        <span style="font-weight:600;font-size:22px;color:#CFE3D6;">app.lealtab.com</span>
      </div>
    </div>

    <div class="row" style="justify-content:space-between;align-items:flex-end;position:relative;z-index:1;">
      <div class="stack gap-8">
        <span style="font-weight:600;font-size:18px;color:#FFFDF8;">lealtab.com</span>
        <span class="body" style="color:#CFE3D6;font-size:16px;">¿Dudas? Escríbenos por WhatsApp.</span>
      </div>
      <div class="row gap-12" style="align-items:center;">
        <span class="accent-dot"></span>
        <span style="font-weight:600;font-size:18px;color:#FFFDF8;">Piloto abierto</span>
      </div>
    </div>
  </div>
</body>
</html>
