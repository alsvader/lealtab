<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="_base.css" />
</head>
<body>
  <div class="slide bg-bosque pad" style="display:flex;flex-direction:column;justify-content:space-between;">
    <img class="aro-corner aro-tr" src="../../../03-visual-identity/recursos/aro/lt-aro-marketing-completo.svg" alt="" style="filter:brightness(0) invert(1);opacity:0.18;" />
    <img class="aro-corner aro-bl" src="../../../03-visual-identity/recursos/aro/lt-aro-marketing-vacio.svg" alt="" style="filter:brightness(0) invert(1);opacity:0.12;" />

    <div class="topbar">
      <img class="logo-h-lg" src="../../../03-visual-identity/logo/entregables/svg/lealtab-horizontal-lino.svg" alt="LealTab" />
    </div>

    <div class="stack gap-32" style="position:relative;z-index:1;max-width:1280px;">
      <h1 class="display">Haz que tus clientes siempre regresen.</h1>
      <p class="lead" style="max-width:860px;color:#CFE3D6;">Tu tarjeta de lealtad, ahora en el celular de tus clientes. Sin app que descargar.</p>
    </div>

    <div class="row" style="justify-content:space-between;align-items:flex-end;position:relative;z-index:1;">
      <span class="handle" style="font-size:28px;color:#CFE3D6;">@getlealtab</span>
      <div class="row gap-16" style="align-items:center;">
        <span class="accent-dot"></span>
        <span style="font-weight:600;font-size:20px;color:#FFFDF8;">lealtab.com</span>
      </div>
    </div>
  </div>

</html>
